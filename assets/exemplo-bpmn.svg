<title id="title">Exemplo BPMN: tratamento de uma solicitação de configuração</title><desc id="desc">Início, analisar solicitação e decidir se as informações estão completas. Se não, solicitar complemento e voltar à análise. Se sim, configurar o sistema, validar com o solicitante e encerrar.</desc>
